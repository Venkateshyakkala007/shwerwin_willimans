services:
  web:
    image: cover-codebase-v3-local
    command: npm run dev -- --host 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      BACKEND_API_URL: http://api:4000
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      api:
        condition: service_healthy
  api:
    image: cover-codebase-v3-local
    build:
      context: .
      target: development
    command: sh -c "npm run db:migrate && npm run db:seed && npm run db:seed:v3 && npm run api:dev"
    ports: ["127.0.0.1:4000:4000"]
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      AUTH_ADAPTER: local
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      API_ALLOWED_ORIGIN: http://localhost:3000
      DEFAULT_USER_ID: 7c986e20-43a2-4a86-817d-6effc840ca91
      DATABASE_URL: postgresql://cover_app:cover_dev@postgres:5432/cover_codebase
      DATABASE_POOL_SIZE: "10"
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    image: cover-codebase-v3-local
    restart: unless-stopped
    command: npm run sync:nightly
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://cover_app:cover_dev@postgres:5432/cover_codebase
      REDIS_URL: redis://redis:6379
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cover_codebase
      POSTGRES_USER: cover_app
      POSTGRES_PASSWORD: cover_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cover_app -d cover_codebase"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:

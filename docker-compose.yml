services:
  web:
    build: .
    command: npm run dev
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      ALLOW_FAKE_CONNECTORS: "true"
      DATABASE_URL: postgresql://cover_app:cover_dev@postgres:5432/cover_codebase
      REDIS_URL: redis://redis:6379
    volumes: [".:/app", "/app/node_modules"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: npm run sync:nightly
    environment:
      NODE_ENV: development
      ALLOW_FAKE_CONNECTORS: "true"
      DATABASE_URL: postgresql://cover_worker:cover_dev@postgres:5432/cover_codebase
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cover_codebase
      POSTGRES_USER: cover_app
      POSTGRES_PASSWORD: cover_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
